<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenVessel prototype</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }

      body {
        margin: 0;
        padding: 1.5rem;
        display: grid;
        gap: 1rem;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      }

      h1 {
        grid-column: 1 / -1;
        font-size: 1.1rem;
        margin: 0;
      }

      section {
        display: grid;
        gap: 0.5rem;
        align-content: start;
      }

      h2 {
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        opacity: 0.6;
        margin: 0;
      }

      pre {
        margin: 0;
        padding: 0.75rem;
        background: #111;
        border: 1px solid #333;
        border-radius: 6px;
        white-space: pre-wrap;
        word-break: break-word;
        max-height: 60vh;
        overflow: auto;
      }

      iframe {
        width: 100%;
        height: 320px;
        border: 1px solid #333;
        border-radius: 6px;
        background: #fff;
      }

      @media (max-width: 900px) {
        body {
          grid-template-columns: minmax(0, 1fr);
        }
      }
    </style>
  </head>
  <body>
    <h1>OpenVessel prototype — one origin, host + runtime + preview</h1>

    <section>
      <h2>Status</h2>
      <pre id="status">starting…</pre>
    </section>

    <section>
      <h2>Terminal</h2>
      <pre id="terminal"></pre>
    </section>

    <section>
      <h2>Log</h2>
      <pre id="log"></pre>
    </section>

    <section>
      <h2>Preview</h2>
      <div id="preview"></div>
    </section>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
